name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Re-use resized images between runs so builds stay fast
      - uses: actions/cache@v4
        with:
          path: |
            _site/media
            src/_data/imagemeta.json
          key: media-${{ hashFiles('media/**') }}
          restore-keys: media-
      - run: npm run build
        env:
          # Preview lives at /meiravhaber-site/; set to "/" when meiravhaber.com points here
          PATH_PREFIX: /meiravhaber-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
